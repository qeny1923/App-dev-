<h1>Student List</h1>
<button>
    <a href="{% url 'add_student' %}">+ Add Student</a>
</button>
<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.age }}</td>
            <td>
                <a href="{% url 'edit_student' student.id %}">Edit</a>
                <a href="{% url 'delete_student' student.id %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<style>
    button {
        display: block;
        margin: 20px auto;
        padding: 10px 20px;
        background-color: #de87ed;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    h1 {
        text-align: center;
        margin-top: 20px;
    }

    table {
        border: 1px solid #de87ed;
        border-collapse: collapse;
        width: 100%;
        margin-top: 20px;
        margin-bottom: 20px;
        margin-left: auto;
        margin-right: auto;
        padding: 40px;
    }

    th, td {
        border: 1px solid #ddd;
        padding: 20px;
        text-align: left;
    }

    th {
        background-color: #de87ed;
    }

</style>
